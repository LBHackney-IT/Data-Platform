version: "3.9"
services:
  unit_tests:
    container_name: unit_test_runner
    # Glue 4.0 (Python 3.10, Spark 3.3), matching the jobs' glue_version
    image: amazon/aws-glue-libs@sha256:96328b13eb3f1d1328bbc790714e0ece2360400ac791c5c5c65cd49e9e178712
    working_dir: /home/glue_user/workspace/scripts
    ports:
      - "4041:4040"
    entrypoint: bash -c "python3 -m pip install -r ./requirements.test.txt && python3 -m pytest ./${filename}"
    volumes:
      - .:/home/glue_user/workspace/scripts
